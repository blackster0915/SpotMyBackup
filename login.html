<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="content-type" content="text/html; charset=UTF-8">
		<title>Login Window</title>
                <script type="text/javascript" src="config.json"></script>
		<script type='text/javascript'>//<![CDATA[ 

			var conf = config;

			window.onload = function() {
				var target = window.self === window.top ? window.opener : window.parent;
				var params = new URLSearchParams(window.location.search);
				if (params.has('code') || params.has('error')) {
				    var result = { code: params.get('code'), state: params.get('state'), error: params.get('error') };
				    // Spotify's login page can cut the link to window.opener, so also hand the result over via localStorage
				    try {
				        localStorage.setItem('spotmybackup_auth', JSON.stringify(result));
				    } catch (e) {}
				    if (target) {
				        target.postMessage(result, conf.uri); //embedded
				    }
				    document.body.innerHTML = 'Login finished, you can close this window.';
				    window.close();
				}
			}
		</script>
	</head>
	<body>
	  
	</body>
</html>
