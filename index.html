var conf = config;

var authWindow = null;
var token = null;
var refreshToken = null;
var refreshTimer = null;
var pkce = { verifier: null, state: null };
var userId = '';
var collections = {};
var name = 'spotify';

var isImporting = false;
var isExporting = false;
var globalStep = "";
var playlistStep = 0;
var trackStep = 0;
var trackTotal = 0;

var playlistQueue = [];
var savedQueue = [];

var makingChanges = false;

function refreshTrackData(callback) {
    if (!isExporting && !isImporting) {
        isExporting = true;
        resetCounter();
        $('#pnlLoadingAccount').show();
        $('#loadingTitle').html('Please wait. Loading your playlists and tracks ...');
        refreshPlaylist(function () {
            refreshMyMusicTracks(function () {
                // refreshStarredTracks(function () {
                    $('#loadingTitle').html('Finished loading, you now might want to export or import.');
                    isExporting = false;
                    callback();
                // });
            });
        });
    }
}

function resetCounter() {
    globalStep = '';
    playlistStep = 0;
    playlistTotal = 0;
    trackStep = 0;
    trackTotal = 0;
}

function refreshProgress() {
    $('#globalStep').html(globalStep);
    $('#playlistStep').html(playlistStep);
    $('#playlistTotal').html(playlistTotal);
    $('#trackStep').html(trackStep);
    $('#trackTotal').html(trackTotal);
    var progress = 0;
    if (trackTotal > 0) {
        var progress = Math.floor(((trackStep / trackTotal) * 100));
    }
    $('#progressBar').css('width', progress+'%')
    if (typeof collections !== 'undefined' && !makingChanges) {
        var set = collectionProperties(collections);
        $('#loadingPlaylists').html(""+set.playlistCount+" playlists");
        $('#loadingTracks').html(""+set.trackCount+" tracks");
    }
    if (typeof importColl !== 'undefined') {
        var set2 = collectionProperties(importColl);
        $('#filePlaylists').html(""+set2.playlistCount+" playlists");
        $('#fileTracks').html(""+set2.trackCount+" tracks");
    }
    setTimeout(refreshProgress, 1000);
}

function randomString(length) {
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    var values = crypto.getRandomValues(new Uint8Array(length));
    var result = '';
    for (var i = 0; i < length; i++) {
        result += chars[values[i] % chars.length];
    }
    return result;
}

function sha256Base64Url(text) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (hash) {
        return btoa(String.fromCharCode.apply(null, new Uint8Array(hash)))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    });
}

function login() {
    if (!conf.client_id || conf.client_id.indexOf('[') === 0) {
        alert('Please put the Client ID of your Spotify app into config.json first.');
        return;
    }
    var width = 480, height = 640;
    var left = (screen.width / 2) - (width / 2);
    var top = (screen.height / 2) - (height / 2);

    // open the popup right away, browsers block popups that are opened after an async step
    authWindow = window.open(
        "",
        "Spotify",
        'menubar=no,location=no,resizable=no,scrollbars=no,status=no, width=' + width + ', height=' + height + ', top=' + top + ', left=' + left
    );
    if (!authWindow) {
        alert('Please allow popups for this page and try again.');
        return;
    }

    // Authorization Code with PKCE, Spotify removed the implicit grant flow in November 2025
    pkce.verifier = randomString(64);
    pkce.state = randomString(16);
    sha256Base64Url(pkce.verifier).then(function (challenge) {
        var set = {
          client_id: conf.client_id,
          redirect_uri: conf.redirect_uri,
          scope: 'playlist-read-private playlist-read-collaborative playlist-modify-public playlist-modify-private user-library-read user-library-modify',
          response_type: 'code',
          code_challenge_method: 'S256',
          code_challenge: challenge,
          state: pkce.state,
          show_dialog: 'true'
        };
        authWindow.location.href = "https://accounts.spotify.com/authorize?" + urlEncodeSet(set);
    });
}

function authCallback(event){
    if (event.origin !== conf.uri) {
        console.log("config.uri missconfigured:");
        console.log({ uri: conf.uri, origin: event.origin });
        return;
    }
    handleAuthResult(event.data);
}

// login.html also writes its result to localStorage, for when Spotify's login page cut the link to window.opener
function authStorageCallback(event) {
    if (event.key === 'spotmybackup_auth' && event.newValue) {
        handleAuthResult(JSON.parse(event.newValue));
    }
}

function handleAuthResult(result) {
    if (!result || !pkce.state || result.state !== pkce.state) {
        return;
    }
    pkce.state = null;
    try {
        localStorage.removeItem('spotmybackup_auth');
    } catch (e) {}
    if (authWindow) {
        authWindow.close();
    }
    if (result.error || !result.code) {
        alert('Spotify login failed: ' + (result.error || 'no code received'));
        return;
    }
    requestToken({
        grant_type: 'authorization_code',
        code: result.code,
        redirect_uri: conf.redirect_uri,
        client_id: conf.client_id,
        code_verifier: pkce.verifier
    }, function () {
        // access tokens expire after one hour, long imports need a fresh one
        clearInterval(refreshTimer);
        refreshTimer = setInterval(function () {
            requestToken({
                grant_type: 'refresh_token',
                refresh_token: refreshToken,
                client_id: conf.client_id
            }, function () {});
        }, 50 * 60 * 1000);
        handleAuth(token);
    });
}

function requestToken(params, callback) {
    $.ajax({
        method: "POST",
        url: 'https://accounts.spotify.com/api/token',
        data: params
    })
    .done(function (response) {
        token = response.access_token;
        if (response.refresh_token) {
            refreshToken = response.refresh_token;
        }
        callback();
    })
    .fail(function (jqXHR) {
        console.log(jqXHR.responseText);
        alert('Spotify token request failed: ' + jqXHR.responseText);
    });
}

// $.ajax with the current token, waits and retries when Spotify answers 429 (rate limit)
function spotifyAjax(options) {
    var deferred = $.Deferred();
    function attempt() {
        $.ajax($.extend({}, options, { headers: { 'Authorization': 'Bearer ' + token } }))
        .done(function (data, textStatus, jqXHR) {
            deferred.resolve(data, textStatus, jqXHR);
        })
        .fail(function (jqXHR, textStatus, errorThrown) {
            if (jqXHR.status == 429) {
                var wait = (parseInt(jqXHR.getResponseHeader('Retry-After'), 10) || 10) * 1000;
                console.log('Rate limited by Spotify, retrying in ' + (wait / 1000) + 's');
                setTimeout(attempt, wait);
            } else {
                deferred.reject(jqXHR, textStatus, errorThrown);
            }
        });
    }
    attempt();
    return deferred.promise();
}

function urlEncodeSet(set) {
    var comps = [];
    for (var i in set) {
        if (set.hasOwnProperty(i)) {
            comps.push(encodeURIComponent(i)+"="+encodeURIComponent(set[i]));
        }
    }
    var string = comps.join("&");
    return string;
}

function download(filename, text) {
    // a Blob URL instead of a data: URI, large libraries exceed the data: URI size limit
    var pom = document.createElement('a');
    pom.setAttribute('href', URL.createObjectURL(new Blob([text], { type: 'application/json' })));
    pom.setAttribute('download', filename);
    document.body.appendChild(pom);
    pom.click();
    document.body.removeChild(pom);
}

function readFile(evt) {
    //Retrieve the first (and only!) File from the FileList object
    var f = evt.target.files[0];

    if (f) {
        $('#fileName').html(f.name);

        var r = new FileReader();
        r.onload = function(e) {
            var json = e.target.result;

            importColl = JSON.parse(json);

            $('#pnlFile').hide();
            $('#pnlFileInfo').show();
            $('#pnlUpload').show();

            compareEverything();
        }
        r.readAsText(f);
    } else {
      alert("Failed to load file");
    }
}

function collectionProperties(coll) {
    return { playlistCount: collPlaylistCount(coll), trackCount: collTrackCount(coll) };
}

function collTrackCount(coll) {
    var count = 0;
    var keys = _.keys(coll.playlists);
    $.each(keys, function (index, value) {
        count += coll.playlists[value].tracks.length;
    });
    if (coll.starred) {
        count += coll.starred.length;
    }
    if (coll.saved) {
        count += coll.saved.length;
    }
    return count;
}

function collPlaylistCount(coll) {
    var keys = _.keys(coll.playlists);
    var count = keys.length + 1;
    if (!("importedStarred" in keys)) {
        count++;
    }
    return count;
}

function compareEverything() {
    if (!isImporting && !isExporting) {
        isImporting = true;
        makingChanges = true;
        resetCounter();

        savedQueue = [];
        playlistQueue = [];

        globalStep = "Uploading";
        if (typeof importColl !== 'undefined') {

            playlistTotal = collPlaylistCount(importColl);

            // TONOTDO:compare starred -> can not really do that since there is no api to manipulate those
            // instead we just create a replacement-standard-list
            globalStep = "Comparing starred tracks";

            makeSureImportedStarredExists(function (proceed) {
                if (proceed) {
                    compareUriTracks(importColl.starred, collections.starred || [], addToStarred);
                }
                // compare saved
                globalStep = "Comparing saved tracks";
                compareUriTracks(importColl.saved || [], collections.saved, addToSaved);
                playlistStep += 1;

                // compare other playlists
                var playlistNames = _.keys(importColl.playlists);
                globalStep = "Comparing custom playlists";
                handlePlaylistCompare(playlistNames.reverse(), function () {
                    handleTrackUpload();
                });
            });
        }
    }
}

function handleTrackUpload() {

    trackDiff = savedQueue.length + playlistQueue.length;
    trackTotal = Math.max(collTrackCount(importColl), trackDiff);
    trackStep = trackTotal - trackDiff;


    if (trackTotal > 0) {
        $('#progressBar').show();
        globalStep = "Uploading tracks";
        handleSavedRequests(savedQueue, function () {
            handlePlaylistRequests(playlistBatches(playlistQueue).reverse(), function () {
                globalStep = "Finished uploading";
                trackTotal = trackStep;
                isImporting = false;
            });
        });
    } else {
        globalStep = "No new tracks found in import";
    }
}

function handlePlaylistCompare(names, callback) {
    var name = names.pop();
    if (!name) {
        callback();
        return;
    }
    var imported = importColl.playlists[name];
    if (imported.followed) {
        // tracks of other people's playlists can't be read anymore, so follow the playlist instead of copying it
        playlistStep += 1;
        if (!playlistIdKnown(imported.id)) {
            addToSaved('spotify:playlist:' + imported.id);
        }
        handlePlaylistCompare(names, callback);
        return;
    }
    makeSurePlaylistExists(name, function (proceed) {
        if (proceed) {
            var playlistId = collections.playlists[name].id;
            compareUriTracks(imported.tracks, collections.playlists[name].tracks, function (uri) {
                addToPlaylist(playlistId, uri);
            });
        }
        handlePlaylistCompare(names, callback);
    });
}

function playlistIdKnown(id) {
    return _.some(_.values(collections.playlists), function (playlist) {
        return playlist.id == id;
    });
}

function addToPlaylist(playlistId, trackUri) {
    // local files can't be added through the API
    if (trackUri.indexOf('spotify:local:') === 0) {
        return;
    }
    playlistQueue.push({ playlistId: playlistId, uri: trackUri });
}

// groups the queued tracks into requests of up to 100 tracks for the same playlist, keeping their order
function playlistBatches(queue) {
    var batches = [];
    var current = null;
    $.each(queue, function (index, entry) {
        if (!current || current.playlistId != entry.playlistId || current.uris.length == 100) {
            current = { playlistId: entry.playlistId, uris: [] };
            batches.push(current);
        }
        current.uris.push(entry.uri);
    });
    return batches;
}

function makeSurePlaylistExists(name, callback) {
    playlistStep += 1;
    if (name in collections.playlists && !collections.playlists[name].followed) {
        callback(true);
        return;
    }
    var set = { name: name, public: false };
    spotifyAjax({
        method: "POST",
        url: 'https://api.spotify.com/v1/me/playlists',
        data: JSON.stringify(set),
        contentType: 'application/json'
    })
    .done(function(response) {
        collections.playlists[response.name] = {
            name: response.name,
            id: response.id,
            tracks: []
        };
        callback(true);
    })
    .fail(function (jqXHR) {
        console.log('Could not create playlist ' + name, jqXHR.responseText);
        callback(false);
    });
}

function makeSureImportedStarredExists(callback) {
    if (!importColl.starred || importColl.starred.length == 0) {
        callback(false);
        return;
    }
    var name = 'importedStarred';
    makeSurePlaylistExists(name, callback);
}

function addToStarred(trackUri) {
    var name = 'importedStarred';
    var playlistId = collections.playlists[name].id;
    uriInTracks(trackUri, collections.playlists[name].tracks, function (uri) {
        addToPlaylist(playlistId, uri);
    });
}

function handleSavedRequests(arr, callback) {
    // the library endpoint takes at most 40 URIs per request
    var uris = arr.splice(0, 40);
    if (uris.length > 0) {
        trackStep += uris.length;
        spotifyAjax({
            method: "PUT",
            url: 'https://api.spotify.com/v1/me/library?uris=' + encodeURIComponent(uris.join(','))
        })
        .fail(function (jqXHR) {
            console.log(jqXHR.responseText);
        })
        .always(function () {
            handleSavedRequests(arr, callback);
        });
    } else {
        callback();
    }
}


function handlePlaylistRequestsWithTimeout(arr, callback) {
        setTimeout(function() { console.log("Fast runners are dead runners"); handlePlaylistRequests(arr, callback) }, conf.slowdown_import);
}

function handlePlaylistRequests(arr, callback) {
    var batch = arr.pop();
    if (batch) {
        trackStep += batch.uris.length;
        spotifyAjax({
            method: "POST",
            url: 'https://api.spotify.com/v1/playlists/' + batch.playlistId + '/items',
            data: JSON.stringify({ uris: batch.uris }),
            contentType: 'application/json'
        })
        .fail(function (jqXHR) {
            console.log(jqXHR.responseText);
        })
        .always(function () {
            handlePlaylistRequestsWithTimeout(arr, callback);
        });
    } else {
        callback();
    }
}

function uriInTracks(uri, tracks, addCallback) {
    var found = false;
    $.each(tracks, function (index, value) {
        if (value.uri == uri) {
            found = true;
        }
    });
    if (!found) {
        addCallback(uri);
    }
}

function addToSaved(uri) {
    savedQueue.push(uri);
}

function compareUriTracks(imported, stored, addCallback) {
    $.each(imported, function (index, value) {
        var found = false;
        $.each(stored, function (index2, value2) {
            if (value.uri == value2.uri) {
                found = true;
            }
        });
        if (!found) {
            addCallback(value.uri);
        }
    });
}

function bindControls() {
    $('#btnImport').click(function () {
        $('#pnlAction').hide();
        $('#pnlImport').show();
    });
    $('#btnExport').click(function () {
        var json = JSON.stringify(collections);
        var d = new Date();
        var time = '@' + d.getFullYear() + '_' + (d.getMonth() + 1) + '_' + d.getDate();
        download(name+time+'.json', json);
    });
    $('#fileImport').change(readFile);
}

function handleAuth(accessToken) {
    token = accessToken;
    // fetch my public playlists
    spotifyAjax({
        url: 'https://api.spotify.com/v1/me'
    })
    .done(function(response) {
        var user_id = response.id.toLowerCase();
        userId = user_id;
        name = user_id;

        $('#userName').html(name);
        $('#pnlLoggedOut').hide();

        refreshTrackData(function () {
            $('#pnlAction').show();
        });
    })
    .fail(function (jqXHR) {
        console.log(jqXHR.status, jqXHR.responseText);
        var hint = '';
        if (jqXHR.status == 403) {
            // Development Mode apps only serve accounts listed under "User Management" in the Spotify dashboard
            hint = '\n\nThis Spotify account is probably not listed under "User Management" of your app in the Spotify developer dashboard (name + the e-mail address of this account).';
        }
        alert('Spotify refused access (HTTP ' + jqXHR.status + '): ' + jqXHR.responseText + hint);
    });
}

function refreshMyMusicTracks(callback) {
    collections.saved = [];
    playlistStep += 1;
    loadTrackChunks('https://api.spotify.com/v1/me/tracks?limit=50', collections.saved, callback);
}

function loadTrackChunksWithTimeout(url, arr, callback, timeout) {
        setTimeout(function() { console.log("Taking breath, not to fast my cheetah"); loadTrackChunks(url, arr, callback) }, conf.slowdown_export);
}

function loadTrackChunks(url, arr, callback) {
    spotifyAjax({
        url: url
    })
    .done(function (data) {
        if (!data) {
            callback();
            return;
        }
        $.each(data.items || [], function (index, value) {
            // playlist entries are called "item" since February 2026, saved tracks still use "track"
            var track = value.item || value.track;
            if (track && track.uri && track.uri.indexOf('spotify:local:') !== 0) {
                arr.push({ id: track.id, uri: track.uri });
            } else {
                console.log("track is null or a local file", value);
            }
        });
        if (data.next) {
            loadTrackChunksWithTimeout(data.next, arr, callback);
        } else {
            callback();
        }
    })
    .fail(function (jqXHR) {
        console.log('Could not load ' + url, jqXHR.responseText);
        callback();
    });
}

function refreshPlaylist(callback) {
    collections.playlists = {};
    var playlists = [];
    loadPlaylistChunks('https://api.spotify.com/v1/me/playlists?limit=50', playlists, function () {
        handlePlaylistTracks(playlists, collections.playlists, callback);
    });
}

function loadPlaylistChunks(url, arr, callback) {
    spotifyAjax({
        url: url
    })
    .done(function (data) {
        if (!data) {
            callback();
            return;
        }
        $.each(data.items || [], function (index, value) {
            if (!value) {
                return;
            }
            // "items" was called "tracks" before February 2026
            var items = value.items || value.tracks;
            var own = value.collaborative || (value.owner && value.owner.id.toLowerCase() == userId);
            if (own && items && items.href) {
                arr.push({
                    name: value.name,
                    href: items.href,
                    id: value.id,
                    tracks: []
                });
            } else {
                // Spotify only returns the tracks of playlists you own or collaborate on
                arr.push({
                    name: value.name,
                    id: value.id,
                    uri: value.uri,
                    followed: true,
                    tracks: []
                });
            }
        });
        if (data.next) {
            loadPlaylistChunks(data.next, arr, callback);
        } else {
            callback();
        }
    })
    .fail(function (jqXHR) {
        console.log('Could not load ' + url, jqXHR.responseText);
        callback();
    });
}

function handlePlaylistTracks(arr, result, callback) {
    var item = arr.pop();
    if (!item) {
        return callback();
    }
    playlistStep += 1;
    if (item.followed) {
        result[item.name] = item;
        handlePlaylistTracks(arr, result, callback);
        return;
    }
    item.tracks = [];
    loadTrackChunks(item.href, item.tracks, function () {
        delete item.href;
        result[item.name] = item;
        handlePlaylistTracks(arr, result, callback);
    });
}

    } else {
        $('#login').click(login);
        window.addEventListener("message", authCallback, false);
        window.addEventListener("storage", authStorageCallback, false);
        bindControls();
        refreshProgress();
    }
}
